id: "official/poster-scene"
asset_type: "poster"
label: "场景海报（section 用）"
description: "角色在特定场景中的海报，用于网站不同 section 的背景或氛围图。比 key-visual 海报更注重场景氛围和留白，适合叠加文字。"
tags: ["poster", "scene", "section", "background"]
size: "1536x1024"

prompt_template: |
  atmospheric scene poster for {{repo_name}} featuring {{character_visual}},
  the character is in this specific scene: {{signature_scene}},
  rendered in {{art_style}} using {{color_palette}},
  the composition has generous negative space and breathing room — not a dense busy illustration,
  the character occupies roughly one-third to one-half of the canvas, leaving open areas suitable for text overlay,
  atmospheric lighting and mood that matches the scene's emotional tone,
  the background is a believable environment (not a flat color), but kept soft and non-distracting,
  subtle {{key_motifs}} woven into the environment as decorative details,
  landscape 3:2 aspect ratio suitable for web hero or section backgrounds,
  no text, no title, no watermark rendered in the image,
  masterpiece, best quality

constraints:
  - "character occupies roughly 1/3 to 1/2 of the canvas — leave generous negative space for text overlay"
  - "soft non-distracting background environment — not a flat solid color, but not visually noisy"
  - "NO text, title, watermark, or logo rendered in the image"
  - "landscape 3:2 aspect ratio"
