id: "official/chibi-grid-4x4"
asset_type: "chibi_emojis"
label: "4x4 Emoji Pack"
description: "4x4 Chibi emoji sheet, auto-sliceable into 16 standalone expressions. Consistency is harder than the 3x3 variant."
tags: ["chibi_emojis", "sticker", "chibi", "grid"]
size: "1024x1024"

grid:
  rows: 4
  cols: 4
  sliceable: true

prompt_template: |
  strict 4x4 chibi sticker sheet with exactly sixteen stickers of the same {{character_visual}},
  sixteen clearly distinct expressions and actions: {{expression_set}},
  simplified cute proportions, large head, bold readable silhouette, use {{color_palette}} and {{key_motifs}},
  consistent identity and outfit in every cell, expressions readable at emoji size,
  perfectly flat uniform matte background of pure {{matte_color}}, no off-color, no gradient or texture,
  generous spacing between stickers with large margins, stickers must not touch cell edges or each other,
  each sticker is simple and minimal — no background props, no text labels, no complex scenery inside any cell,
  square 1:1 aspect ratio, evenly spaced isolated stickers, masterpiece, white die-cut sticker look, best quality

constraints:
  - "strict 4-row × 4-column grid with exactly 16 stickers"
  - "generous margin around every sticker; stickers must not touch cell edges or each other"
  - "stickers must not overlap or merge; every sticker must form one isolated foreground silhouette"
  - "perfectly flat uniform matte background of pure {{matte_color}} — no off-color, grey, gradient, or texture"
  - "matte_color must be a color absent from the character, costume, props, outlines, and effects"
  - "matte_color must NOT be white (#FFFFFF) or near-white — most characters contain white in their outfit/highlights/eyes, and a white matte would be punched out together with those whites during chroma-key extraction, destroying the silhouette"
  - "each sticker must be simple and minimal — no background props, no text labels, no complex scenery inside any cell"
  - "no borders, frames, dividing lines, grid lines, or cell boxes"
