id: "official/hero-character-migrate"
asset_type: "hero_composite"
label: "Hero Character Migration"
description: >
  Replace the character in a starter hero composite with the project's foundation character.
  Composition, pose, and negative-space placement follow the first reference (starter hero) exactly.
  Background, colors, and character identity follow the second reference (foundation).
  The prompt only sketches intent — details are carried by the reference images.
tags: ["hero", "migrate", "web", "landing"]
size: "2560x1440"
quality: "high"

prompt_template: |
  Hero composite background image for a landing page, 16:9 widescreen.
  Two reference images are provided. The FIRST is the layout/composition reference —
  match its character pose, body language, and blank-zone layout exactly.
  The SECOND is the character identity reference — take the character from it.
  Replace the character in the first image with the character from the second,
  keeping the pose and composition identical. Redesign the background and colors
  to match the second reference's palette and atmosphere. Seamless composite,
  no cutout edges. No text, no UI elements.

constraints:
  - "Character pose must match the layout reference exactly"
  - "Left blank zone must stay empty for HTML overlay"
  - "No text or UI elements"
  - "Character identity must match the foundation reference"
