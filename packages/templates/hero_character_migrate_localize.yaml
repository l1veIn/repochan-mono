id: "official/hero-character-migrate-localize"
asset_type: "hero_composite"
label: "Hero Character Localization"
description: >
  Borrow the starter hero's design language (style, atmosphere, composition approach)
  but do not lock the pose. Redraw with the foundation character and palette as a
  localization. Blank zones are specified by the order's mustInclude, not hard-coded
  in the template — the same template works across starters with different blank-zone layouts.
tags: ["hero", "migrate", "web", "landing"]
size: "2560x1440"
quality: "high"

prompt_template: |
  Hero composite background image for a landing page, 16:9 widescreen.
  Two reference images are provided. The FIRST is a design-language reference —
  draw inspiration from its visual style, atmosphere, and composition approach,
  but you are NOT required to copy the exact pose or layout. The SECOND is the
  character identity reference — localize the character from it into the scene.
  Redesign freely using the foundation character's identity, palette, and
  personality, while keeping the design language of the first reference.
  Seamless composite, no cutout edges. No text, no UI elements.

constraints:
  - "Design language must echo the composition reference (style/atmosphere)"
  - "Character identity must match the foundation reference"
  - "No text or UI elements"
  - "Blank zones (specified in the order) must stay empty for HTML overlay"
