id: "official/character-cutout"
asset_type: "character_cutout"
label: "Character Cutout (Custom Pose on Matte)"
description: "Custom character pose on a flat matte background, extracted to transparent PNG via chroma-key. Used to break rectangular containers: peeking out of section edges, floating between sections, providing interaction guidance. Default output is a **fully in-frame** general asset (full body / three-quarter figure, clear margin on all four sides). Bleed-crop compositions are design-bound variants (see the last constraint) and must not be shipped as general-purpose starter assets."
tags: ["character_cutout", "cutout", "transparent", "pose", "web"]
size: "1024x1024"

prompt_template: |
  ONE single full-body character illustration of {{character_visual}},
  the character is performing this specific pose/action: {{cutout_pose}},
  clean cel-shaded style consistent with {{art_style}},
  using {{color_palette}},

  Extraction setup: render exactly one isolated asset, centered with a clear margin, white die-cut sticker look,
  on a perfectly flat uniform matte background of pure {{matte_color}}.
  Do not use gradients, texture, vignette, shadows, reflections, contact shadows, scenery, props, labels, frames, or background-colored details.
  Keep the full subject visible and separated from the matte.
  The character is the ONLY thing on the matte background — no props, no furniture, no scenery.
  The character does NOT touch any edge — generous margin on all four sides.
  Every part of the character is complete and in frame: hair tips, fingers, shoe soles, cables, held items — nothing is cropped by the canvas.
  The character's silhouette is clean and uncluttered.
  Simple self-contained outfit and accessories — nothing extending beyond the body silhouette.
  No text, no watermark, no signature.

  masterpiece, best quality

constraints:
  - "ONE single character on a perfectly flat uniform matte background — no grid, no multiple poses"
  - "matte background must be pure flat {{matte_color}} — no gradients, texture, shadow, or off-color"
  - "character must NOT touch any canvas edge — generous margin on all four sides"
  - "every body part, hair tip, finger, shoe, cable and held item is fully visible — no edge cropping"
  - "NO props, furniture, scenery, or background elements — character only"
  - "NO text, watermark, or signature"
  - "clean self-contained silhouette suitable for chroma-key extraction"
  - "matte_color must be a color absent from the character, costume, props, outlines, and effects"
  - "matte_color must NOT be white (#FFFFFF) or near-white — most characters contain white in their outfit/highlights/eyes, and a white matte would be punched out together with those whites during chroma-key extraction, destroying the silhouette"
  - "choose the matte hue by distance from the subject: green matte for pink/purple-dominant subjects, magenta for green-dominant subjects, green for deep-red-dominant subjects"
  - "do not reproduce layout-guide boxes, lines, crosshairs, or labels from any reference guide image"
  - "bleeding/cropped compositions (subject exits the canvas edge) are design-bound variants: they are only valid when the target page has H3/H4 layer elements acting as the visual boundary that receives the crop (e.g. a card edge the character leans on, a section boundary the hair sweeps behind). They may enter starter/general libraries only when paired with a pose lineart that transmits the pose to downstream projects (see official/hero-pose-lineart-extract) — the crop's structural relationship with page layers must be reproducible"
