id: "official/iconfont-grid-4x4"
asset_type: "icon_font"
label: "4×4 角色 iconfont"
description: "16 个角色风格 UI 图标，替代 lucide/outside icon set。涵盖常见网页功能（首页/设置/搜索/下载…），可切片为独立 SVG 风格 PNG。"
tags: ["icon_font", "iconfont", "ui", "grid", "sliceable"]
size: "1024x1024"

grid:
  rows: 4
  cols: 4
  sliceable: true

prompt_template: |
  strict 4x4 icon font sheet for {{repo_name}}, exactly sixteen distinct UI icons in ONE coherent brand family,
  each icon is a simple flat glyph derived from the character's visual language: {{key_motifs}} and {{color_palette}},
  every icon uses the same line weight, the same geometric vocabulary, and the same cel-shaded style,

  the 16 icons represent common web UI functions, one per cell, in this fixed order:

  ROW 1 (top): home/house icon, search/magnifier icon, settings/gear icon, user/profile icon,
  ROW 2: document/file icon, download icon, upload icon, link/chain icon,
  ROW 3: heart/like icon, star/favorite icon, bell/notification icon, mail/envelope icon,
  ROW 4: chart/graph icon, shield/lock icon, code/terminal icon, github/logo-mark icon,

  each icon is centered in its cell with generous padding, bold readable silhouette,
  flat solid white background (#FFFFFF) in every cell,
  icons use only {{color_palette}} — predominantly the main color and one accent,
  no text, no letters, no numbers inside any icon cell,
  consistent gutter and alignment between all cells, no content crossing cell boundaries,
  readable at small sizes, premium product-icon finish, masterpiece, best quality

constraints:
  - "strict 4-row × 4-column grid with exactly 16 equal cells"
  - "row 1: home, search, settings, user  |  row 2: document, download, upload, link  |  row 3: heart, star, bell, mail  |  row 4: chart, shield, code, github"
  - "every icon must stay fully inside its own cell with generous padding; no content crossing boundaries"
  - "pure solid white (#FFFFFF) background in every cell"
  - "NO text, letters, numbers, or labels inside any cell"
  - "consistent line weight and geometric style across all 16 icons — one coherent icon family"
  - "icons use only the character's color palette"
