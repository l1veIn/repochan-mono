id: "official/foundation-sheet"
asset_type: "foundation_sheet"
label: "Foundation Sheet"
description: "Project visual anchor: full-body standing pose, chibi, expressions, color palette swatches, key motifs, and icon sample."
tags: ["foundation_sheet", "sheet", "foundation", "anchor"]
size: "1024x1024"

prompt_template: |
  professional anime character foundation sheet for {{repo_name}}, single clean concept-sheet composition,
  {{character_visual}}, character name "{{character_name}}" rendered as a readable text title,
  one main full-body illustration using {{signature_pose}}, plus a small visual cue of {{signature_action}},
  one simplified chibi, three distinct expression headshots, compact palette swatches using {{color_palette}} with readable color name labels,
  key motif callouts for {{key_motifs}} with short readable text labels,
  one polished app-icon mockup derived from the character,
  balanced composition with equal visual weight across all sections, no single element dominating the layout,
  avoid depicting the character writing or reading handwritten text — if the character holds a book or notebook it must be closed,
  neat white or very light background, readable hierarchy, consistent identity across every depiction,
  masterpiece, best quality

constraints: []
