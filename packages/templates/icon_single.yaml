id: "official/icon-single"
asset_type: "icon"
label: "单 icon（可缩放）"
description: "一个干净的角色品牌 icon，适合 resize 为 favicon / app icon / logo。纯色背景，高对比，favicon 尺寸可辨认。"
tags: ["icon", "favicon", "logo", "brand"]
size: "512x512"

prompt_template: |
  ONE single app icon / brand mark for {{repo_name}},
  derived from the character's most iconic visual element: {{key_motifs}},
  bold simple emblem with a crisp silhouette, centered, high contrast against a solid flat background,
  using {{color_palette}},
  the icon must be readable and recognizable at favicon size (16×16px),
  minimal layered geometry, balanced negative space, premium product finish,
  no text, no letters, no numbers, no watermark, no border, no frame,
  flat cel-shaded style consistent with the character's art style,
  the icon fills the canvas with generous padding so it can be cropped tight or loose,
  masterpiece, best quality

constraints:
  - "exactly ONE single icon centered on the canvas — no grid, no multiple variants"
  - "bold simple silhouette readable at 16×16px favicon size"
  - "solid flat background color (no gradient, no texture, no pattern in background)"
  - "NO text, letters, numbers, labels, or watermarks"
  - "generous padding around the icon so it works at any crop ratio"
  - "no border, no frame, no decorative ring around the icon"
