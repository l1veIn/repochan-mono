id: "official/hero-pose-lineart-extract"
asset_type: "pose_lineart"
label: "人物姿态线稿提取"
description: >
  从人物合成图中提取纯人物姿态线稿——只保留角色，去掉一切无关信息。
  唯一用途：当人物姿态与页面 H3/H4 层元素存在结构/空间配合关系时
  （例如按钮悬在人物手心上方、人物指向某个具体标题、人物坐在卡片边缘），
  向下游传递必须复现的姿态信息。海报式摆放（姿态无结构意义）不应使用本模板。
tags: ["hero", "lineart", "starter", "prep", "pose"]
size: "2560x1440"
quality: "high"

prompt_template: |
  Clean character-pose lineart extraction from the reference image. The ONLY
  purpose of this lineart is to transmit the character's pose to a downstream
  artist who must reproduce it exactly, because the pose has a structural
  relationship with page elements (e.g. a button resting above the character's
  open palm, the character pointing at a specific headline, the character
  sitting on a card edge).

  KEEP (extract as clean lineart — character only):
  - Character body pose: limb positions, gesture, weight distribution
  - Character silhouette and overall body shape
  - Gaze direction and pointing direction (they are part of the pose contract)
  - Hand shapes and open-palm / holding gestures in detail — page elements may
    be designed to rest on or align with them

  REMOVE (do not draw — everything that is not the character):
  - All scene and background elements: architecture, furniture, horizon,
    atmosphere, particles, decorations
  - All held/carried objects and props — keep only the hand gesture/position
  - All colors, shading, gradients, shadows, highlights
  - All clothing details: folds, textures, patterns, accessories
  - All facial features beyond a simple head/gaze indication
  - All material rendering: metal, fabric, skin tones

  The result should look like a rough anatomical gesture sketch of ONE
  character — pure black lines on pure white background. Think mannequin +
  pose arrows, not a finished drawing. The character's position and scale in
  the frame MUST match the reference exactly (same side, same proportion of
  frame occupied), because page layers are positioned against that placement.

constraints:
  - "Pure black lines on pure white background — no grays, no fills"
  - "Character only: no scene, no props, no background elements of any kind"
  - "Character position, scale and pose must be identical to the reference"
  - "Hand gestures and gaze/pointing direction must be precisely preserved — page elements align with them"
  - "No colors, no shading, no clothing details, no facial features"
