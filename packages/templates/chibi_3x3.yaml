id: "official/chibi-grid-3x3"
asset_type: "chibi_emojis"
label: "3x3 Emoji Pack"
description: "3x3 Chibi emoji sheet, auto-sliceable into nine standalone expressions. Recommended default."
tags: ["chibi_emojis", "sticker", "chibi", "grid"]
size: "1024x1024"

grid:
  rows: 3
  cols: 3
  sliceable: true
  cell_keys:
    - "wave"
    - "curious"
    - "surprised"
    - "thinking"
    - "confident"
    - "celebrating"
    - "sleepy"
    - "pointing"
    - "cozy"

prompt_template: |
  strict 3x3 chibi sticker sheet with exactly nine stickers of the same {{character_visual}},
  simplified cute proportions, large head, bold readable silhouette, use {{color_palette}} and {{key_motifs}},
  consistent identity and outfit in every cell, expressions readable at emoji size,
  perfectly flat uniform matte background of pure {{matte_color}}, no off-color, no gradient or texture,
  generous spacing between stickers with large margins, stickers must not touch cell edges or each other,
  each sticker is simple and minimal — no background props, no text labels, no complex scenery inside any cell,
  square 1:1 aspect ratio, evenly spaced isolated stickers, white die-cut sticker look, masterpiece, best quality

  The nine expressions in fixed positions (left-to-right, top-to-bottom):

  CELL 0 (top-left):    waving hello — cheerful open-mouthed smile, one hand raised waving at the viewer (✧ᗜ✧)
  CELL 1 (top-center):  curious/inspecting — leaning forward with a jeweler's loupe or magnifying glass, intense curious expression (⊙_⊙)?
  CELL 2 (top-right):   surprised/amazed — wide eyes, both hands raised, mouth open in delight at something glowing (∑(O_O;))
  CELL 3 (middle-left): thinking/pondering — finger on chin, looking up, thoughtful expression with a small idea lightbulb (￣ω￣)?
  CELL 4 (middle-center): confident/proud — arms crossed, eyes closed, satisfied knowing smile (￣▽￣)ゞ
  CELL 5 (middle-right): celebrating/success — both arms raised in victory, stars/sparkles around, triumphant grin ＼(^o^)／✧
  CELL 6 (bottom-left): sleepy/tired — head resting on folded arms on a desk, "zzz" floating, peaceful exhausted expression (=_=) zzZ
  CELL 7 (bottom-center): pointing/presenting — pointing upward with one hand, other hand showing a small glowing spark, encouraging expression (๑•̀ㅂ•́)و✧
  CELL 8 (bottom-right): cozy/content — holding a steaming mug with both hands, gentle closed-eye smile, warm satisfied feeling (*´∀`)

constraints:
  - "strict 3-row × 3-column grid with exactly 9 stickers"
  - "cell 0 = waving hello (✧ᗜ✧), cell 1 = curious/inspecting (⊙_⊙)?, cell 2 = surprised/amazed (∑(O_O;))"
  - "cell 3 = thinking/pondering (￣ω￣)?, cell 4 = confident/proud (￣▽￣)ゞ, cell 5 = celebrating/success ＼(^o^)／✧"
  - "cell 6 = sleepy/tired (=_=) zzZ, cell 7 = pointing/presenting (๑•̀ㅂ•́)و✧, cell 8 = cozy/content (*´∀`)"
  - "generous margin around every sticker; stickers must not touch cell edges or each other"
  - "stickers must not overlap or merge; every sticker must form one isolated foreground silhouette"
  - "perfectly flat uniform matte background of pure {{matte_color}} — no off-color, grey, gradient, or texture"
  - "matte_color must be a color absent from the character, costume, props, outlines, and effects"
  - "matte_color must NOT be white (#FFFFFF) or near-white — most characters contain white in their outfit/highlights/eyes, and a white matte would be punched out together with those whites during chroma-key extraction, destroying the silhouette"
  - "each sticker must be simple and minimal — no background props, no text labels, no complex scenery inside any cell"
  - "no borders, frames, dividing lines, grid lines, or cell boxes"
  - "keep a safe margin of about 10% of the cell size inside every cell; sticker subjects including props and effects stay within the inner safe area"
  - "choose the matte hue by distance from the subject: green matte for pink/purple-dominant subjects, magenta for green-dominant subjects, green for deep-red-dominant subjects"
  - "do not reproduce layout-guide boxes, lines, crosshairs, or cell labels/numbers from any reference guide image"
