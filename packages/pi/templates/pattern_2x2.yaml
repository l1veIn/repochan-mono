id: "official/pattern-grid-2x2"
asset_type: "visual_pattern"
label: "2×2 品牌纹理矩阵"
description: "四张可切分的品牌纹理/背景 tile，用于页面 section 背景、边框暗纹、社交图背景和装饰图层。"
tags: ["pattern", "texture", "background", "page"]

width: 1024
height: 1024
aspect_ratio: "1:1"
background: "illustrated"

grid:
  rows: 2
  cols: 2
  sliceable: true

guide: "seamless pattern design sheet, clean product branding, high usability"

constraints:
  - "2×2 grid, exactly 4 distinct pattern tiles, arranged in a strict 2-row × 2-column layout"
  - "each tile is a complete seamless repeating pattern concept derived from the repository mascot and visual motifs"
  - "include generous gutters between tiles so each pattern can be cropped cleanly"
  - "no characters as main subjects; patterns should use motifs, symbols, silhouettes, artifact cards, threads, stamps, swatches, or small abstract marks"
  - "patterns must be subtle enough for web section backgrounds and must not reduce text readability"
  - "each tile should explore a different use case: hero texture, section background, border/divider pattern, social/OG backdrop"
  - "avoid large readable text inside the patterns; small abstract labels or visual marks are acceptable if integrated as decorative texture"
  - "preserve the persona's color palette and pageTheme mood"
  - "professional web brand texture sheet, not a wallpaper collage"
