id: "official/poster"
asset_type: "poster"
label: "角色大海报"
description: "纯艺术表现的大尺寸角色海报，释放 persona.artStyle 的视觉冲击力。不受设定集的结构约束（不需要全身+chibi+配色卡），聚焦一张有冲击力的角色主视觉。"
tags: ["poster", "illustration", "showcase"]

width: 1536
height: 1024
aspect_ratio: "3:2"
background: "illustrated"

guide: "masterpiece, best quality, highly detailed"

constraints:
  - "horizontal poster illustration, landscape orientation, aspect ratio 3:2"
  - "single character as the dominant focal point, large and impactful"
  - "full artistic freedom on composition — dynamic pose, dramatic angle, environmental storytelling all encouraged"
  - "the character's persona.artStyle must drive the visual treatment (e.g. cyberpunk neon = glowing lines + dark bg; watercolor = soft washes; thick paint = visible brushstrokes; neo-brutalism = raw high-contrast; memphis = colorful geometric shapes; glitch art = digital distortion artifacts)"
  - "background should complement the art style and project atmosphere, not be plain white"
  - "DO NOT include design-sheet elements (no chibi, no expression grid, no color palette swatches, no callout labels) — this is a poster, not a reference sheet"
  - "render text directly into the poster as part of the artwork: the character's name (large stylized title), the repository name (smaller, as a subtitle or logo), and optionally a short tagline or key motif word. Choose typography that matches the art style and project atmosphere. The text should feel integrated into the composition, not pasted on."
